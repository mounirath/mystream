<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 MyStream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">🎬 MyStream</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher...">
        </div>
        <div class="user-actions" style="display:flex;gap:10px;align-items:center;">
            <a href="/admin.html" class="btn-refresh" title="Administration" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">⚙️</a>
            <button class="btn-refresh" id="refreshBtn" title="Rafraîchir">🔄</button>
        </div>
    </header>

    <nav class="filters">
        <button class="filter-btn active" data-filter="all">✨ Tout</button>
        <button class="filter-btn" data-filter="film">🎥 Films</button>
        <button class="filter-btn" data-filter="serie">📺 Séries</button>
        <button class="filter-btn" data-filter="favorites">⭐ Favoris</button>
        <div class="quality-filters">
            <button class="quality-pill" data-quality="720">720p</button>
            <button class="quality-pill" data-quality="1080">1080p</button>
            <button class="quality-pill" data-quality="2160">4K</button>
        </div>
    </nav>

    <div class="groups-bar" id="groupsBar"></div>

    <main class="main">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-content">
                <div class="welcome-icon">🎬</div>
                <h1>Bienvenue sur MyStream</h1>
                <p>Aucun fichier M3U actif. <a href="/admin.html" style="color:#a855f7;">Accédez à l'administration</a> pour importer ou activer une playlist.</p>
                <button class="btn-retry" id="retryBtn">🔄 Réessayer</button>
            </div>
        </div>

        <div class="loading-screen" id="loadingScreen" style="display:none;">
            <div class="spinner"></div>
            <p>Chargement du catalogue...</p>
        </div>

        <div class="content-grid" id="contentGrid" style="display:none;"></div>
    </main>

    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <div class="player-header">
                <h2 id="playerTitle">Titre</h2>
                <div class="player-controls">
                    <div class="quality-selector" id="qualitySelector">
                        <button class="quality-btn-player" id="qualityToggle">🎚️ <span id="currentQualityLabel">Auto</span></button>
                        <div class="quality-menu" id="qualityMenu"></div>
                    </div>
                    <button class="close-btn" id="closePlayer">✕</button>
                </div>
            </div>
            <div class="player-wrapper">
                <video id="videoPlayer" controls autoplay></video>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
